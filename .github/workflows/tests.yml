name: Numerical validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -e '.[dev,maps]'
      - run: python -m pytest -q
      - run: python scripts/validate_conditional.py
      - run: cmb-lab --quick
      - uses: actions/upload-artifact@v4
        with:
          name: quick-analysis
          path: results/quick/
